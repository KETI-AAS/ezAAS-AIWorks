version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CAPABILITY_DISCOVERY_API_URL=http://localhost:8001
      - NEXT_PUBLIC_DATASET_ORCHESTRATION_API_URL=http://localhost:8002
      - NEXT_PUBLIC_AI_DEPLOY_API_URL=http://localhost:8003

  capability-discovery:
    build: ./services/capability-discovery
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    depends_on:
      - postgres
      - minio

  dataset-orchestration:
    build: ./services/dataset-orchestration
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    depends_on:
      - postgres
      - minio

  ai-deploy:
    build: ./services/ai-deploy
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    depends_on:
      - redis
      - ray

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezai
      POSTGRES_USER: ezai
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/test
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  ray:
    image: rayproject/ray:2.5.0
    command: ray start --head --redis-password=''

volumes:
  postgres_data:
  minio_data:
