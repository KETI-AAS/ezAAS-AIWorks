[tool.poetry]
name = "dataset-orchestration"
version = "0.1.0"
description = "Dataset Orchestration service (FastAPI)"
authors = ["ezAAS Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
