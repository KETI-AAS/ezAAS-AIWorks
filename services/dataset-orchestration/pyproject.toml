[tool.poetry]
name = "dataset-orchestration"
version = "0.1.0"
description = "레거시 제조데이터 의미 매핑 · 전처리 · AI-Ready 데이터셋 생성 서비스 (FastAPI)"
authors = ["ezAAS Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.22.0"}
pydantic = "^2.5"
pandas = ">=2.2"
numpy = ">=1.26"
python-multipart = ">=0.0.9"
openpyxl = "^3.1"
httpx = ">=0.27"
# 선택 의존성 (환경변수로 활성화)
pyarrow = { version = ">=15", optional = true }
sentence-transformers = { version = ">=2.7", optional = true }
neo4j = { version = "^5.20", optional = true }

[tool.poetry.extras]
parquet = ["pyarrow"]
embeddings = ["sentence-transformers"]
graph = ["neo4j"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
